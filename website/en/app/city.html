<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Destination · ZheshGo</title>
  <meta name="description" content="ZheshGo city guide."/>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#3D6B5C"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
<link rel="alternate" hreflang="en" href="/en/app/city.html"/><link rel="alternate" hreflang="ja" href="/ja/app/city.html"/><link rel="alternate" hreflang="ko" href="/ko/app/city.html"/><link rel="stylesheet" href="../css/i18n.css"/><script src="../js/i18n-route.js?v=20261016-ko-picker-2"></script></head>
<body data-page="explore" data-app="app">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <div id="detail"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>

  <script src="../js/data/content.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var id = ZW.param("id");
      var c = ZW.getCity(id);
      var el = document.getElementById("detail");
      if (!c) { ZW.notFound("This destination guide doesn't exist yet"); return; }

      document.title = c.name + " — " + c.role + " · ZheshGo";
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute("content", c.tagline);

      var factsHtml = c.facts.length
        ? "<div class=\"side-card\"><h3>Practical basics</h3><table class=\"fact-table\"><tbody>" +
          c.facts.map(function (f) {
            return "<tr><th>" + ZW.esc(f.k) + "</th><td>" + ZW.esc(f.v) +
              (f.s ? ' <span class="small muted">(' + ZW.esc(f.s) + ")</span>" : "") + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : "";

      var ownRoutes = ZW.CONTENT.routes.filter(function (r) { return r.city === c.id && r.status !== "archived"; });
      var linkRoutes = ZW.CONTENT.routes.filter(function (r) {
        return r.city !== c.id && r.cities.indexOf(c.id) !== -1 && r.status !== "archived";
      });
      var places = (c.places || []).map(ZW.getPlace).filter(Boolean);
      var previewCities = ZW.CONTENT.cities.filter(function (o) { return o.preview; });

      var routesHtml = ownRoutes.length
        ? "<section class=\"section\"><div class=\"wrap\"><div class=\"section-head\"><div><p class=\"section-eyebrow\">Routes from " + ZW.esc(c.name) + "</p><h2>Draft routes to try</h2></div></div>" +
          '<div class="route-grid">' + ownRoutes.map(ZW.routeCard).join("") + "</div></div></section>"
        : "";

      var linksHtml = linkRoutes.length
        ? "<section class=\"section section-alt\"><div class=\"wrap\"><div class=\"section-head\"><div><p class=\"section-eyebrow\">How to reach " + ZW.esc(c.name) + "</p><h2>Connector routes</h2></div></div>" +
          '<div class="route-grid">' + linkRoutes.map(ZW.routeCard).join("") + "</div></div></section>"
        : "";

      var placesHtml = places.length
        ? "<section class=\"section\"><div class=\"wrap\"><div class=\"section-head\"><div><p class=\"section-eyebrow\">In " + ZW.esc(c.name) + "</p><h2>Places we cover</h2></div></div>" +
          '<div class="route-grid">' + places.map(ZW.placeCard).join("") + "</div></div></section>"
        : "";

      var previewHtml = c.preview
        ? "<div class=\"note-box warn\"><h4>Preview only</h4>We haven’t published routes, timetables or prices for " + ZW.esc(c.name) +
          " yet — we publish detail only after verifying it. Meanwhile, Ningbo is our first full pilot city guide.</div>"
        : "";

      el.innerHTML =
        '<div class="page-hero" style="position:relative;overflow:hidden">' +
        '<div style="position:absolute;inset:0;opacity:.5" aria-hidden="true"><img src="' + ZW.esc(c.art) + '" alt="" style="width:100%;height:100%;object-fit:cover"/></div>' +
        '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,242,233,.25),rgba(246,242,233,.94))"></div>' +
        '<div class="wrap" style="position:relative">' +
        "<nav class=\"crumbs\" aria-label=\"Breadcrumb\"><a href=\"index.html\">Home</a><span class=\"sep\">/</span><a href=\"explore.html\">Explore</a><span class=\"sep\">/</span><span>" + ZW.esc(c.name) + "</span></nav>" +
        '<p class="section-eyebrow" style="font-family:var(--serif-zh);letter-spacing:.5em;font-size:1rem">' + ZW.esc(c.zh) + " · " + ZW.esc(c.name) + "</p>" +
        '<h1>' + ZW.esc(c.name) + " — " + ZW.esc(c.role) + "</h1>" +
        '<p class="lead" style="max-width:620px">' + ZW.esc(c.tagline) + "</p>" +
        '<div class="flex mt1">' + ZW.verifyBadge(c) +
        (c.gateway ? "<span class=\"pill-demo\">Popular gateway</span>" : "") + "</div>" + ZW.provenance(c) +
        "</div></div>" +
        '<div class="wrap page">' +
        '<div class="detail-grid">' +
        '<div>' +
        previewHtml +
        '<h2 class="mt0">' + (c.preview ? "Why it's on our list" : "What to know") + "</h2>" +
        "<p>" + ZW.esc(c.intro) + "</p>" +
        "<div class=\"note-box info\"><h4>Content status</h4>Demo seed content. Anything time-sensitive — transport, hours, prices, entry rules — is marked “please verify before travel”. We don’t publish numbers we can’t check.</div>" +
        "</div>" +
        '<aside class="sticky-side">' + factsHtml +
        (c.preview ? "" : "<div class=\"side-card\"><h3>Good to know</h3><ul class=\"side-list\">" +
          (c.gateway ? "<li>" + ZW.icon("check") + " A familiar arrival/departure point with English signage.</li>" : "") +
          "<li>" + ZW.icon("check") + " Metro is the workhorse; ride-hailing handles door-to-door.</li>" +
          "<li>" + ZW.icon("warn") + " Set up mobile payment before you land — it makes everything easier.</li>" +
          "</ul></div>") +
        "</aside></div>" +
        placesHtml + routesHtml + linksHtml +
        "</div>";

      ZW.bindSaveButtons(el);
      ZW.log("view_guide", { type: "city", id: c.id });
    })();
  </script>
</body>
</html>
