<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Explore guides &amp; routes · ZheshGo</title>
  <meta name="description" content="Browse ZheshGo's Shanghai and Zhejiang travel guides: destinations, themed routes and filters by duration, pace and who's traveling."/>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#3D6B5C"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
<link rel="stylesheet" href="../css/i18n.css"/><script src="../js/i18n-route.js?v=20261016-ko-picker-2"></script></head>
<body data-page="explore" data-app="app">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="page-hero">
      <div class="wrap">
        <p class="section-eyebrow">Explore</p>
        <h1>Guides with a point of view</h1>
        <p class="lead">Destinations, themed routes and honest trade-offs — filter by what fits your trip. Draft content: verify anything marked before you travel.</p>
      </div>
    </div>

    <div class="wrap page">
      <div class="tabs" role="tablist" aria-label="Browse destinations or routes">
        <button role="tab" id="tab-dest" aria-selected="true" aria-controls="panel-dest">Destinations</button>
        <button role="tab" id="tab-routes" aria-selected="false" aria-controls="panel-routes">Routes &amp; themes</button>
      </div>

      <!-- Destinations panel -->
      <section id="panel-dest" role="tabpanel" aria-labelledby="tab-dest">
        <div class="dest-grid" id="dest-grid"></div>
        <div class="mt3" id="preview-cities"></div>
      </section>

      <!-- Routes panel -->
      <section id="panel-routes" role="tabpanel" aria-labelledby="tab-routes" hidden>
        <div class="planner-card mb2" aria-label="Route filters">
          <div class="field mb1">
            <label id="f-city-label">City</label>
            <div class="chip-row" role="group" aria-labelledby="f-city-label" id="f-city"></div>
          </div>
          <div class="field mb1">
            <label id="f-theme-label">Theme</label>
            <div class="chip-row" role="group" aria-labelledby="f-theme-label" id="f-theme"></div>
          </div>
          <div class="field mb1">
            <label id="f-days-label">Max duration</label>
            <div class="chip-row" role="group" aria-labelledby="f-days-label" id="f-days"></div>
          </div>
          <div class="field mb1">
            <label id="f-pace-label">Pace</label>
            <div class="chip-row" role="group" aria-labelledby="f-pace-label" id="f-pace"></div>
          </div>
          <div class="field mb0">
            <label id="f-group-label">Who's traveling</label>
            <div class="chip-row" role="group" aria-labelledby="f-group-label" id="f-group"></div>
          </div>
          <p class="mt2 mb0"><button class="btn btn-secondary btn-sm" type="button" id="f-clear">Clear filters</button></p>
        </div>
        <p class="small muted" id="f-count" aria-live="polite"></p>
        <div class="route-grid" id="route-grid"></div>
        <div class="empty" id="route-empty" hidden>
          <div class="empty-art" id="re-art"></div>
          <h3>No routes match those filters</h3>
          <p>Try fewer filters — we only publish a handful of draft routes so far.</p>
          <button class="btn btn-primary" type="button" id="re-clear">Clear filters</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>

  <script src="../js/data/content.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var C = ZW.CONTENT;
      var qs = new URLSearchParams(location.search);

      /* ---- tabs ---- */
      var tabDest = document.getElementById("tab-dest");
      var tabRoutes = document.getElementById("tab-routes");
      var panelDest = document.getElementById("panel-dest");
      var panelRoutes = document.getElementById("panel-routes");
      function setTab(which) {
        var routes = which === "routes";
        tabDest.setAttribute("aria-selected", String(!routes));
        tabRoutes.setAttribute("aria-selected", String(routes));
        panelDest.hidden = !routes ? false : true;
        panelRoutes.hidden = routes ? false : true;
      }
      tabDest.addEventListener("click", function () { setTab("dest"); });
      tabRoutes.addEventListener("click", function () { setTab("routes"); });
      document.querySelector(".tabs").addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        var tabs = [tabDest, tabRoutes];
        var idx = tabs.indexOf(document.activeElement);
        var next = e.key === "ArrowRight" ? (idx + 1) % 2 : (idx + 1) % 2;
        if (idx === -1) next = 0;
        tabs[next].focus();
        tabs[next].click();
      });
      if (qs.get("theme") || qs.get("city")) setTab("routes");

      /* ---- destinations ---- */
      var dg = document.getElementById("dest-grid");
      dg.innerHTML = C.cities.filter(function (c) { return !c.preview; }).map(ZW.cityCard).join("");
      var pv = document.getElementById("preview-cities");
      pv.innerHTML =
        '<h3 class="mt0" style="font-size:1rem;font-family:var(--sans)">More of Zhejiang — preview only</h3>' +
        '<p class="small muted">We publish detail only after it is verified. These cities are on our shortlist:</p>' +
        '<div class="flex">' +
        C.cities.filter(function (c) { return c.preview; }).map(function (c) {
          return '<a class="chip" href="city.html?id=' + c.id + '">' + ZW.esc(c.name) + " — preview</a>";
        }).join("") + "</div>";
      ZW.bindSaveButtons(dg);

      /* ---- route filters ---- */
      var state = {
        city: qs.get("city") || "any",
        theme: qs.get("theme") || "any",
        days: qs.get("days") || "any",
        pace: qs.get("pace") || "any",
        group: qs.get("group") || "any",
      };
      function chips(el, options, key, multi) {
        el.innerHTML = options.map(function (o) {
          var active = state[key] === o.v;
          return '<button class="chip" type="button" role="checkbox" aria-checked="' + active + '" data-key="' + key + '" data-val="' + ZW.esc(o.v) + '">' + ZW.esc(o.l) + "</button>";
        }).join("");
        el.querySelectorAll("button").forEach(function (b) {
          b.addEventListener("click", function () {
            state[b.getAttribute("data-key")] = b.getAttribute("data-val");
            apply();
          });
        });
      }
      var cityOpts = [{ v: "any", l: "Anywhere" }].concat(C.cities.filter(function (c) { return !c.preview; }).map(function (c) { return { v: c.id, l: c.name }; }));
      var themeOpts = [{ v: "any", l: "All themes" }].concat(C.themes.map(function (t) { return { v: t.name, l: t.name }; }));
      var dayOpts = [{ v: "any", l: "Any length" }, { v: 1, l: "1 day" }, { v: 2, l: "Up to 2 days" }, { v: 3, l: "Up to 3 days" }];
      var paceOpts = [{ v: "any", l: "Any pace" }, { v: "Gentle", l: "Gentle" }, { v: "Moderate", l: "Moderate" }, { v: "Relaxed", l: "Relaxed" }];
      var groupOpts = [{ v: "any", l: "Any traveler" }, { v: "Solo", l: "Solo" }, { v: "Couples", l: "Couples" }, { v: "Friends", l: "Friends" }, { v: "Families", l: "Families" }];
      chips(document.getElementById("f-city"), cityOpts, "city");
      chips(document.getElementById("f-theme"), themeOpts, "theme");
      chips(document.getElementById("f-days"), dayOpts, "days");
      chips(document.getElementById("f-pace"), paceOpts, "pace");
      chips(document.getElementById("f-group"), groupOpts, "group");

      function apply() {
        // re-render chip states
        document.querySelectorAll("#panel-routes [data-key]").forEach(function (b) {
          var active = state[b.getAttribute("data-key")] === b.getAttribute("data-val");
          b.setAttribute("aria-checked", active);
          b.classList.toggle("selected", active);
        });
        var filter = {
          city: state.city !== "any" ? state.city : null,
          theme: state.theme !== "any" ? state.theme : null,
          days: state.days !== "any" ? parseInt(state.days, 10) : null,
          pace: state.pace,
          group: state.group,
        };
        var list = ZW.getRoutes(filter);
        var grid = document.getElementById("route-grid");
        var empty = document.getElementById("route-empty");
        document.getElementById("f-count").textContent = list.length + " draft route" + (list.length === 1 ? "" : "s") + " match your filters.";
        grid.innerHTML = list.map(ZW.routeCard).join("");
        ZW.bindSaveButtons(grid);
        empty.hidden = list.length > 0;
        grid.style.display = list.length > 0 ? "" : "none";
        // sync URL
        var u = new URL(location.href);
        ["city", "theme", "days", "pace", "group"].forEach(function (k) {
          if (state[k] !== "any") u.searchParams.set(k, state[k]); else u.searchParams.delete(k);
        });
        history.replaceState(null, "", u);
        ZW.log("filter", state);
      }
      document.getElementById("f-clear").addEventListener("click", function () {
        state = { city: "any", theme: "any", days: "any", pace: "any", group: "any" };
        apply();
      });
      document.getElementById("re-clear").addEventListener("click", function () {
        state = { city: "any", theme: "any", days: "any", pace: "any", group: "any" };
        apply();
      });
      document.getElementById("re-art").innerHTML = ZW.icon("explore");
      apply();
    })();
  </script>
</body>
</html>
