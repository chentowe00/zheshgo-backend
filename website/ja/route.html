<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>モデルコース · ZheshGo</title>
  <meta name="description" content="ZheshGoのモデルコース。"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#3D6B5C"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
<link rel="alternate" hreflang="en" href="/en/route.html"/><link rel="alternate" hreflang="ja" href="/ja/route.html"/><link rel="alternate" hreflang="ko" href="/ko/route.html"/><link rel="stylesheet" href="css/i18n.css"/><script src="js/i18n-route.js?v=20261016-ko-picker-2"></script></head>
<body data-page="explore">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <div id="detail"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="モバイルメニュー"></nav>

  <script src="js/data/content.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var id = ZW.param("id");
      var r = ZW.getRoute(id);
      var el = document.getElementById("detail");
      if (!r) { ZW.notFound("このコースはまだありません"); return; }

      document.title = r.title + " · ZheshGo";
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute("content", r.summary);
      var city = ZW.getCity(r.city);

      var daysHtml = r.dayByDay.map(function (d) {
        return (
          '<div class="day-block">' +
          '<div class="day-head"><span class="day-num">' + d.day + "</span>" +
          "<h3>日程 " + d.day + " — " + ZW.esc(d.title) + "</h3></div>" +
          d.stops.map(function (s) {
            return (
              '<div class="stop-item"><span class="stop-dot" aria-hidden="true"></span><div>' +
              "<h4>" + ZW.esc(s.name) + "</h4><p>" + ZW.esc(s.note) + "</p></div></div>"
            );
          }).join("") +
          "</div>"
        );
      }).join("");

      var confirmHtml = r.confirmBefore && r.confirmBefore.length
        ? "<div class=\"side-card\"><h3>出発前に確認したいこと</h3><ul class=\"side-list\">" +
          r.confirmBefore.map(function (x) { return "<li>" + ZW.icon("warn") + " " + ZW.esc(x) + "</li>"; }).join("") +
          "</ul></div>"
        : "";

      var highlightHtml = r.highlights && r.highlights.length
        ? "<div class=\"side-card\"><h3>見どころ</h3><ul class=\"side-list\">" +
          r.highlights.map(function (x) { return "<li>" + ZW.icon("check") + " " + ZW.esc(x) + "</li>"; }).join("") +
          "</ul></div>"
        : "";

      var transportHtml = r.transportNotes && r.transportNotes.length
        ? "<div class=\"note-box\"><h4>移動のポイント</h4><ul style=\"margin:4px 0 0;padding-left:18px\">" +
          r.transportNotes.map(function (x) { return "<li>" + ZW.esc(x) + "</li>"; }).join("") +
          "</ul></div>"
        : "";

      var related = ZW.CONTENT.routes.filter(function (o) {
        return o.id !== r.id && o.status !== "archived" && o.city === r.city;
      }).slice(0, 3);

      el.innerHTML =
        '<div class="page-hero"><div class="wrap">' +
        "<nav class=\"crumbs\" aria-label=\"Breadcrumb\"><a href=\"index.html\">ホーム</a><span class=\"sep\">/</span><a href=\"explore.html\">行き先・モデルコース</a><span class=\"sep\">/</span>" +
        (city ? '<a href="city.html?id=' + city.id + '">' + ZW.esc(city.name) + "</a>" : '<span>' + ZW.esc(r.city) + "</span>") +
        '<span class="sep">/</span><span>' + ZW.esc(r.title) + "</span></nav>" +
        '<span class="theme-tag" style="background:var(--celadon-mist);color:var(--celadon-deep)">' + ZW.esc(ZW.label(r.theme)) + "</span>" +
        '<h1 style="max-width:760px">' + ZW.esc(r.title) + "</h1>" +
        '<div class="route-facts" style="font-size:.92rem;gap:8px 22px">' +
        "<span>" + ZW.icon("clock") + " " + r.days + "日" + "" + "</span>" +
        "<span>" + ZW.icon("walk") + " " + ZW.esc(ZW.label(r.pace)) + "のペース</span>" +
        "<span>" + ZW.icon("users") + " " + ZW.esc(r.groups.map(ZW.label).join(" · ")) + "</span>" +
        "</div>" +
        '<div class="flex mt1">' + ZW.verifyBadge(r) +
        "<span class=\"pill-demo\">モデルコース（内容確認中・予約商品ではありません）</span></div>" + ZW.provenance(r) +
        "</div></div>" +
        '<div class="wrap page">' +
        '<div class="detail-grid">' +
        "<div>" +
        '<div class="flex mb1"><button class="btn btn-primary" type="button" id="save-route">' + ZW.icon("heart") + " <span id='save-label'>旅の候補に保存</span></button>" +
        '<a class="btn btn-secondary" href="planner.html?route=' + r.id + "\">旅のプランに組み込む</a></div>" +
        "<h2>このコースの楽しみ方</h2><p>" + ZW.esc(r.why) + "</p>" +
        "<h2>モデルコース</h2>" + daysHtml +
        transportHtml +
        "<div class=\"note-box warn\"><h4>選ぶ前に知っておきたいこと</h4>" + ZW.esc(r.notFor) + "</div>" +
        "<div class=\"note-box info\"><h4>費用について</h4>鉄道、入場料、現地の交通、食事などを予算に含めましょう。確認できない料金は掲載していません。実際の費用は手配前にご確認ください。このサイトで予約は完了しません。</div>" +
        "</div>" +
        '<aside class="sticky-side">' +
        "<div class=\"side-card\"><h3>コースの概要</h3><ul class=\"side-list\">" +
        "<li>" + ZW.icon("explore") + " " + r.cities.map(function (cid) { return ZW.cityName(cid); }).join(" → ") + "</li>" +
        "<li>" + ZW.icon("clock") + " " + r.days + "日" + "" + ", " + ZW.esc(ZW.label(r.pace)) + "のペース</li>" +
        "<li>" + ZW.icon("users") + " 想定する同行者：" + ZW.esc(r.groups.map(ZW.label).join(", ")) + "</li>" +
        "</ul></div>" +
        confirmHtml + highlightHtml +
        "<div class=\"side-card\"><h3>スタッフに相談したいときに</h3><p class=\"small\">日程や同行者に合わない場合は、相談フォームの受付状況をご確認ください。</p>" +
        '<a class="btn btn-sandal btn-sm" href="consult.html?route=' + r.id + "\">スタッフに相談</a></div>" +
        "</aside></div>" +
        (related.length
          ? "<hr class=\"divider\"/><h2>ほかのコース：" + ZW.esc(city ? city.name : "the region") + "</h2>" +
            '<div class="route-grid mt1">' + related.map(ZW.routeCard).join("") + "</div>"
          : "") +
        "</div>";

      var saveBtn = document.getElementById("save-route");
      var saveLabel = document.getElementById("save-label");
      function paintSave() {
        var saved = ZW.isSaved("routes", r.id);
        saveLabel.textContent = saved ? "保存しました" : "旅の候補に保存";
        saveBtn.setAttribute("aria-pressed", String(saved));
      }
      saveBtn.addEventListener("click", function () { ZW.toggleSave("routes", r.id); paintSave(); });
      paintSave();
      ZW.bindSaveButtons(el);
      ZW.log("view_guide", { type: "route", id: r.id });
    })();
  </script>
</body>
</html>
