<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>旅のひろば · ZheshGo</title>
  <meta name="description" content="ZheshGo読者の旅の質問や情報交換。現在は説明用の投稿サンプルを掲載しています。"/>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#3D6B5C"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
<link rel="alternate" hreflang="en" href="/en/app/community.html"/><link rel="alternate" hreflang="ja" href="/ja/app/community.html"/><link rel="alternate" hreflang="ko" href="/ko/app/community.html"/><link rel="stylesheet" href="../css/i18n.css"/><script src="../js/i18n-route.js?v=20261016-ko-picker-2"></script></head>
<body data-page="explore" data-app="app">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="page-hero">
      <div class="wrap">
        <p class="section-eyebrow">旅のひろば · デモ</p>
        <h1>旅の疑問を持ち寄る場所</h1>
        <p class="lead">旅の質問や訂正を共有する仕組みのデモです。以下の投稿はサンプルと表示されています。公開コミュニティとしての運用はまだ始まっていません。</p>
      </div>
    </div>

    <div class="wrap page page-narrow">
      <div class="note-box info"><h4>こんな使い方を考えています</h4>短い質問や旅の記録、訂正を集め、役立つ情報をガイドに反映する仕組みです。現時点では説明用のデモです。</div>

      <div id="threads"></div>

      <hr class="divider"/>
      <h2 class="mt0">質問を書く</h2>
      <p class="small muted">サーバーに送信できた質問は公開前に確認されます。接続できない場合は、このブラウザにのみ保存します。送信結果の表示をご確認ください。</p>
      <form id="ask-form" class="planner-card">
        <div class="field">
          <label for="ask-title">質問内容</label>
          <textarea class="input" id="ask-title" rows="3" placeholder="例：5月に6歳の子どもと東銭湖へ行くなら、1日過ごせますか？" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">投稿する（デモ）</button>
      </form>
      <div id="ask-done" class="note-box" style="border-left-color:var(--bamboo);background:var(--bamboo-soft)" hidden>
        <h4>このブラウザに保存しました</h4>質問はローカルの一覧に表示されます。実際の公開運用では、編集者による確認が必要です。</div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="モバイルメニュー"></nav>

  <script src="../js/data/content.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var SAMPLES = [
        {
          q: "荷物を持って杭州から寧波へ行くなら？",
          a: "杭州東から高速鉄道で約1時間が目安です。駅や列車、荷物預かりの利用条件を確認し、時間に余裕を持たせましょう。これは投稿サンプルです。",
          by: "編集者の回答サンプル",
          tag: "投稿例 · 移動",
        },
        {
          q: "寧波の海鮮料理は夏でも楽しめますか？",
          a: "季節や仕入れによって内容が変わるため、店で当日のメニューを確認しましょう。これは投稿サンプルで、現地確認済みの回答ではありません。",
          by: "編集者の回答サンプル",
          tag: "投稿例 · 食事",
        },
        {
          q: "訂正例：老外灘へは中心部から歩けます",
          a: "情報ありがとうございます。経路や駅の出口を確認してからガイドに反映します。これは訂正投稿のサンプルです。",
          by: "編集者の回答サンプル",
          tag: "投稿例 · 訂正",
        },
      ];
      var box = document.getElementById("threads");
      var serverItems = [];
      function render() {
        var local = [];
        try {
          var raw = JSON.parse(localStorage.getItem("zheway:community") || "[]");
          if (Array.isArray(raw)) local = raw;
        } catch (e) {}
        var server = serverItems.map(function (x) {
          return { q: x.question, a: "編集者が確認・公開した旅行者の質問です。", by: "旅行者の質問（公開承認済み）", tag: "旅行者から" };
        });
        box.innerHTML = server.concat(SAMPLES).concat(local.map(function (x) { return { q: x.q, a: "このブラウザだけに保存された質問です。公開されていません。", by: "あなたの質問（デモ）", tag: "ローカル保存 · 未公開" }; }))
          .map(function (t) {
            return (
              '<article class="card mb2"><div class="card-body">' +
              '<div class="flex" style="justify-content:space-between;gap:8px"><span class="pill-demo" style="font-size:.72rem">' + ZW.esc(t.tag) + "</span></div>" +
              '<h3 class="card-title mt1">' + ZW.esc(t.q) + "</h3>" +
              '<p class="card-desc">' + ZW.esc(t.a) + "</p>" +
              '<p class="card-meta mb0">— ' + ZW.esc(t.by) + "</p>" +
              "</div></article>"
            );
          }).join("");
      }
      // load editor-approved traveler questions
      fetch("/api/v1/submissions/published").then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.items) { serverItems = d.items; render(); } })
        .catch(function () { /* offline — samples only */ });
      document.getElementById("ask-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var q = document.getElementById("ask-title").value.trim();
        if (!q) return;
        var done = document.getElementById("ask-done");
        fetch("/api/v1/submissions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        }).then(function (res) {
          if (!res.ok) throw new Error("http");
          document.getElementById("ask-title").value = "";
          done.innerHTML = "<h4>確認用に送信しました</h4>編集者向けに送信されました。承認された場合に公開されます。";
          done.hidden = false;
        }).catch(function () {
          var local = [];
          try { local = JSON.parse(localStorage.getItem("zheway:community") || "[]") || []; } catch (err) {}
          local.push({ q: q, at: Date.now() });
          try { localStorage.setItem("zheway:community", JSON.stringify(local)); } catch (err2) { ZW.toast("保存機能を利用できないため、質問は残りません。"); }
          document.getElementById("ask-title").value = "";
          done.innerHTML = "<h4>ローカル保存しました（デモ）</h4>サーバーに接続できず、編集者には送信されていません。このブラウザにのみ保存されています。";
          done.hidden = false;
          render();
        });
        ZW.log("community_ask", { len: q.length });
      });
      render();
    })();
  </script>
</body>
</html>
