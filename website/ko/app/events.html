<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>데모 활동 기록 · ZheshGo</title>
  <meta name="description" content="이 브라우저에서 사용한 ZheshGo 기능을 확인하는 데모 활동 기록이에요."/>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#3D6B5C"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
<link rel="alternate" hreflang="en" href="/en/app/events.html"/><link rel="alternate" hreflang="ja" href="/ja/app/events.html"/><link rel="alternate" hreflang="ko" href="/ko/app/events.html"/><link rel="stylesheet" href="../css/i18n.css"/><script src="../js/i18n-route.js?v=20261016-ko-picker-2"></script></head>
<body data-page="explore" data-app="app">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <div class="page-hero">
      <div class="wrap">
        <p class="section-eyebrow">데모 이용 기록</p>
        <h1>이 브라우저의 활동</h1>
        <p class="lead">여행자가 어떤 기능을 쓰는지 살펴보기 위한 기기 내 기록이에요. 언제든 삭제할 수 있어요.</p>
      </div>
    </div>

    <div class="wrap page page-narrow">
      <div class="evt-grid" id="counts"></div>
      <div class="flex mb2">
        <button class="btn btn-secondary btn-sm" type="button" id="refresh">새로고침</button>
        <button class="btn btn-ghost btn-sm" type="button" id="clear">기록 삭제</button>
      </div>
      <div class="evt-log" id="log" aria-live="polite"></div>
      <p class="small muted mt2">세션: <span id="session"></span> · 최근 500개 활동만 보관해요. 가이드·AI·사진 가이드가 실제로 도움이 되는지 살펴보기 위한 데모 기록이에요.</p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="모바일 메뉴"></nav>

  <script src="../js/data/content.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var LABELS = {
        view_home: "홈 조회",
        view_explore: "여행지·코스 조회",
        view_plan: "일정 도구 조회",
        view_assistant: "AI 페이지 조회",
        view_trip: "저장한 여행 조회",
        view_guide: "도시·코스·장소 가이드 조회",
        search: "Searches",
        search_open: "검색 열기",
        filter: "필터 변경",
        save_route: "코스 저장",
        save_place: "장소 저장",
        unsave_route: "코스 저장 해제",
        save_plan_intent: "일정 추천 실행",
        open_assistant: "AI 열기",
        assistant_query: "AI 질문",
        photo_start: "사진 가이드 시작",
        photo_scan: "사진 확인",
        photo_matched: "사진 매칭",
        photo_step: "단계별 안내 조회",
        photo_complete: "가이드 완료",
        photo_abandon: "가이드 중단",
        open_consult: "상담 열기",
        submit_consult: "상담 제출",
        error: "Errors",
        human_handoff: "담당자 상담으로 이동",
        faq_open: "FAQ 펼치기",
        community_ask: "커뮤니티 질문",
        export_trip: "여행 목록 내보내기",
      };
      function render() {
        var counts = ZW.eventCounts();
        var total = ZW.getEvents().length;
        document.getElementById("counts").innerHTML =
          '<div class="evt-count"><b>' + total + "</b><span>이 브라우저의 전체 활동</span></div>" +
          Object.keys(counts).map(function (k) {
            return '<div class="evt-count"><b>' + counts[k] + "</b><span>" + (LABELS[k] || k) + "</span></div>";
          }).join("");
        document.getElementById("log").innerHTML = ZW.getEvents().slice(-120).reverse().map(function (e) {
          var d = new Date(e.ts);
          return "<div>" + d.toLocaleTimeString() + " · " + ZW.esc(e.task) +
            (e.payload && Object.keys(e.payload).length ? " · " + ZW.esc(JSON.stringify(e.payload).slice(0, 90)) : "") + "</div>";
        }).join("");
        document.getElementById("session").textContent = ZW.sessionId;
      }
      document.getElementById("refresh").addEventListener("click", render);
      document.getElementById("clear").addEventListener("click", function () {
        if (confirm("이 브라우저의 ZheshGo 활동 기록을 삭제할까요?")) { ZW.clearEvents(); render(); }
      });
      render();
    })();
  </script>
</body>
</html>
