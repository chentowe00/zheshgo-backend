<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>여행지 · ZheshGo</title>
  <meta name="description" content="ZheshGo 도시 여행 가이드."/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#3D6B5C"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
<link rel="alternate" hreflang="en" href="/en/city.html"/><link rel="alternate" hreflang="ja" href="/ja/city.html"/><link rel="alternate" hreflang="ko" href="/ko/city.html"/><link rel="stylesheet" href="css/i18n.css"/><script src="js/i18n-route.js?v=20261016-ko-picker-2"></script></head>
<body data-page="explore">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <div id="detail"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="모바일 메뉴"></nav>

  <script src="js/data/content.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var id = ZW.param("id");
      var c = ZW.getCity(id);
      var el = document.getElementById("detail");
      if (!c) { ZW.notFound("아직 준비 중인 여행지 가이드예요"); return; }

      document.title = c.name + " — " + c.role + " · ZheshGo";
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute("content", c.tagline);

      var factsHtml = c.facts.length
        ? "<div class=\"side-card\"><h3>알아두면 좋은 기본 정보</h3><table class=\"fact-table\"><tbody>" +
          c.facts.map(function (f) {
            return "<tr><th>" + ZW.esc(f.k) + "</th><td>" + ZW.esc(f.v) +
              (f.s ? ' <span class="small muted">(' + ZW.esc(f.s) + ")</span>" : "") + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : "";

      var ownRoutes = ZW.CONTENT.routes.filter(function (r) { return r.city === c.id && r.status !== "archived"; });
      var linkRoutes = ZW.CONTENT.routes.filter(function (r) {
        return r.city !== c.id && r.cities.indexOf(c.id) !== -1 && r.status !== "archived";
      });
      var places = (c.places || []).map(ZW.getPlace).filter(Boolean);
      var previewCities = ZW.CONTENT.cities.filter(function (o) { return o.preview; });

      var routesHtml = ownRoutes.length
        ? "<section class=\"section\"><div class=\"wrap\"><div class=\"section-head\"><div><p class=\"section-eyebrow\">출발 도시: " + ZW.esc(c.name) + "</p><h2>살펴볼 추천 코스</h2></div></div>" +
          '<div class="route-grid">' + ownRoutes.map(ZW.routeCard).join("") + "</div></div></section>"
        : "";

      var linksHtml = linkRoutes.length
        ? "<section class=\"section section-alt\"><div class=\"wrap\"><div class=\"section-head\"><div><p class=\"section-eyebrow\">가는 방법: " + ZW.esc(c.name) + "</p><h2>함께 이어가는 코스</h2></div></div>" +
          '<div class="route-grid">' + linkRoutes.map(ZW.routeCard).join("") + "</div></div></section>"
        : "";

      var placesHtml = places.length
        ? "<section class=\"section\"><div class=\"wrap\"><div class=\"section-head\"><div><p class=\"section-eyebrow\">도시: " + ZW.esc(c.name) + "</p><h2>소개하는 여행지</h2></div></div>" +
          '<div class="route-grid">' + places.map(ZW.placeCard).join("") + "</div></div></section>"
        : "";

      var previewHtml = c.preview
        ? "<div class=\"note-box warn\"><h4>미리보기</h4>아직 상세 코스를 공개하지 않은 도시: " + ZW.esc(c.name) +
          ". 현지 정보를 확인한 뒤 내용을 보강할 예정이에요. 닝보는 먼저 상세 가이드를 준비하고 있는 도시예요.</div>"
        : "";

      el.innerHTML =
        '<div class="page-hero" style="position:relative;overflow:hidden">' +
        '<div style="position:absolute;inset:0;opacity:.5" aria-hidden="true"><img src="' + ZW.esc(c.art) + '" alt="" style="width:100%;height:100%;object-fit:cover"/></div>' +
        '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,242,233,.25),rgba(246,242,233,.94))"></div>' +
        '<div class="wrap" style="position:relative">' +
        "<nav class=\"crumbs\" aria-label=\"Breadcrumb\"><a href=\"index.html\">홈</a><span class=\"sep\">/</span><a href=\"explore.html\">여행지·코스</a><span class=\"sep\">/</span><span>" + ZW.esc(c.name) + "</span></nav>" +
        '<p class="section-eyebrow" style="font-family:var(--serif-zh);letter-spacing:.5em;font-size:1rem">' + ZW.esc(c.zh) + " · " + ZW.esc(c.name) + "</p>" +
        '<h1>' + ZW.esc(c.name) + " — " + ZW.esc(c.role) + "</h1>" +
        '<p class="lead" style="max-width:620px">' + ZW.esc(c.tagline) + "</p>" +
        '<div class="flex mt1">' + ZW.verifyBadge(c) +
        (c.gateway ? "<span class=\"pill-demo\">대표 출발 도시</span>" : "") + "</div>" + ZW.provenance(c) +
        "</div></div>" +
        '<div class="wrap page">' +
        '<div class="detail-grid">' +
        '<div>' +
        previewHtml +
        '<h2 class="mt0">' + (c.preview ? "이 도시를 소개하는 이유" : "여행 전 알아두기") + "</h2>" +
        "<p>" + ZW.esc(c.intro) + "</p>" +
        "<div class=\"note-box info\"><h4>정보 확인 상태</h4>현재는 데모 자료예요. 이동·운영 시간·요금·입국 규정처럼 달라질 수 있는 정보는 ‘출발 전 확인’으로 표시하며, 확인되지 않은 수치는 확정적으로 안내하지 않아요.</div>" +
        "</div>" +
        '<aside class="sticky-side">' + factsHtml +
        (c.preview ? "" : "<div class=\"side-card\"><h3>여행 준비 팁</h3><ul class=\"side-list\">" +
          (c.gateway ? "<li>" + ZW.icon("check") + " 영어 안내가 있는 주요 도착·출발 거점이에요.</li>" : "") +
          "<li>" + ZW.icon("check") + " 시내는 지하철, 목적지까지 바로 갈 때는 차량 호출을 비교해 보세요.</li>" +
          "<li>" + ZW.icon("warn") + " 출발 전에 모바일 결제 앱의 등록과 이용 조건을 확인해 두세요.</li>" +
          "</ul></div>") +
        "</aside></div>" +
        placesHtml + routesHtml + linksHtml +
        "</div>";

      ZW.bindSaveButtons(el);
      ZW.log("view_guide", { type: "city", id: c.id });
    })();
  </script>
</body>
</html>
